<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Real Facts Website generator!">
  <link rel="stylesheet" href="style.css">
  <title>Only Real Facts</title>
</head>
<body>
  
  <main>

    <div class="container">
      <h1 id="displayer" class="fact-text">False Facts Generator</h1>

      <div class="inputs">
        <label for="factType">About:</label>

        <select class="selectBox" name="fact-type" id="factType">
          <option value="school">School</option>
          <option selected value="tech">Tech</option>
          <option value="world">World</option>
          <option value="all">All</option>
        </select>
      </div>

      <div class="buttons-container">
        <button id="generateBtn" class="btn">Generate</button>
        <button id="copyBtn" class="btn">Copy</button>
      </div>

    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
